<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分支地图</title>
<style>
  /* 颜色全部取 VS Code 主题变量，浏览器里预览时退回 Dark Modern 的值。 */
  :root {
    --bg: var(--vscode-editor-background, #1f1f1f);
    --side: var(--vscode-sideBar-background, #181818);
    --card: var(--vscode-editorWidget-background, #252526);
    --fg: var(--vscode-foreground, #cccccc);
    --strong: var(--vscode-editor-foreground, #e8e8e8);
    --muted: var(--vscode-descriptionForeground, #8b8b8b);
    --faint: #626262;
    --line: var(--vscode-panel-border, #2b2b2b);
    --card-line: #333;
    --hover: var(--vscode-list-hoverBackground, #2a2d2e);
    --select: var(--vscode-list-inactiveSelectionBackground, #37373d);
    --focus: var(--vscode-focusBorder, #0078d4);
    --input: var(--vscode-input-background, #313131);
    --input-line: var(--vscode-input-border, #3c3c3c);
    --tip: var(--vscode-editorHoverWidget-background, #252526);
    --mod: var(--vscode-gitDecoration-modifiedResourceForeground, #e2c08d);
    --add: var(--vscode-gitDecoration-addedResourceForeground, #81b88b);
    --new: var(--vscode-gitDecoration-untrackedResourceForeground, #73c991);
    --del: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39);
    --ren: var(--vscode-gitDecoration-renamedResourceForeground, #73c991);
    --open: #3fb950;
    --merged: #a371f7;
    --font: var(--vscode-font-family, "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif);
    --mono: var(--vscode-editor-font-family, "Cascadia Mono", Consolas, monospace);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  a { color: inherit; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: -1px; }
  .mono { font-family: var(--mono); }

  #app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }

  /* 头像 */
  .av { position: relative; border-radius: 50%; flex: none; display: inline-grid; place-items: center; color: #111; font-weight: 600; overflow: hidden; }
  .av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .av.s16 { width: 16px; height: 16px; font-size: 9px; }
  .av.s22 { width: 22px; height: 22px; font-size: 11px; }
  .av.s26 { width: 26px; height: 26px; font-size: 12px; }
  .av.s36 { width: 36px; height: 36px; font-size: 15px; }

  /* 侧栏 */
  #side { background: var(--side); border-right: 1px solid var(--line); overflow: auto; padding: 12px 8px 20px; }
  .brand { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 8px 12px; }
  .brand b { color: var(--strong); font-size: 13px; }
  .brand span { color: var(--faint); font-size: 11px; }
  .sh { padding: 12px 8px 6px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 5px; }
  .item:hover { background: var(--hover); }
  .item[aria-pressed="true"] { background: var(--select); }
  .item .t { min-width: 0; flex: 1; }
  .item .n1 { color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .n2 { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 4px; align-items: center; }
  .item .n2 svg { flex: none; }
  .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dirty { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mod); display: inline-flex; align-items: center; gap: 4px; }
  .dirty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--mod); }

  /* 主区 */
  #main { overflow: auto; min-width: 0; scroll-behavior: smooth; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 12px; padding: 12px 28px; border-bottom: 1px solid var(--line); }
  .search { display: flex; align-items: center; gap: 8px; background: var(--input); border: 1px solid var(--input-line); border-radius: 4px; padding: 4px 8px; width: 280px; color: var(--muted); }
  .search input { background: none; border: 0; outline: 0; color: var(--strong); font: inherit; width: 100%; }
  .search:focus-within { border-color: var(--focus); }
  .who { display: inline-flex; align-items: center; gap: 8px; padding: 3px 6px 3px 4px; border-radius: 14px; background: var(--select); color: var(--strong); }
  .who button { color: var(--muted); display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; }
  .who button:hover { color: var(--strong); background: var(--hover); }
  .spacer { flex: 1; }
  .legend { font-size: 11px; color: var(--faint); }

  .repo { padding: 22px 28px 8px; scroll-margin-top: 56px; }
  .rhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .rhead h2 { margin: 0 6px 0 0; font-size: 15px; color: var(--strong); font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 12px; font-size: 12px; color: var(--muted); border: 1px solid var(--card-line); white-space: nowrap; }
  button.chip:hover { color: var(--strong); border-color: var(--muted); }
  .chip.warn { color: var(--mod); border-color: color-mix(in srgb, var(--mod) 40%, transparent); }
  .chip.quiet { border-color: transparent; color: var(--faint); padding-left: 2px; }
  .pick { margin-left: auto; background: var(--input); border: 1px solid var(--input-line); color: var(--muted); border-radius: 4px; font: inherit; font-size: 12px; padding: 3px 24px 3px 8px; max-width: 220px; appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 12px) 52%, calc(100% - 8px) 52%; background-size: 4px 4px; background-repeat: no-repeat; }
  .pick:hover { color: var(--strong); }
  .pick option { background: var(--input); color: var(--fg); }

  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .col { min-width: 0; }
  .chead { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 8px; font-size: 12px; color: var(--muted); }
  .chead b { color: var(--fg); font-weight: 600; }
  .chead .n { font-variant-numeric: tabular-nums; }
  .chead .x { margin-left: auto; font-size: 11px; color: var(--faint); }
  .stack { display: grid; gap: 6px; }

  .card { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 10px; width: 100%; padding: 8px 10px; background: var(--card); border: 1px solid var(--card-line); border-radius: 6px; }
  .card:hover { border-color: var(--muted); }
  .card.sel { border-color: var(--focus); }
  .card.dim { opacity: .55; }
  .card .av { grid-row: 1 / span 2; }
  .card .bn { color: var(--strong); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card .meta { grid-column: 2 / span 2; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
  .card .rt { display: flex; gap: 6px; align-items: center; }
  .up { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pr { font-size: 11px; font-family: var(--mono); padding: 0 6px; border-radius: 9px; line-height: 17px; white-space: nowrap; }
  .pr.OPEN { color: var(--open); background: color-mix(in srgb, var(--open) 16%, transparent); }
  .pr.DRAFT { color: var(--muted); background: var(--select); }
  .pr.MERGED { color: var(--merged); background: color-mix(in srgb, var(--merged) 16%, transparent); }
  .pr.CLOSED { color: var(--muted); background: var(--select); text-decoration: line-through; }
  .tag { font-size: 10.5px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--card-line); color: var(--muted); line-height: 16px; white-space: nowrap; }
  .tag.here { border-color: var(--focus); color: var(--strong); }
  .empty { padding: 10px 12px; color: var(--faint); border: 1px dashed var(--card-line); border-radius: 6px; }
  .tail { display: flex; justify-content: space-between; padding-top: 4px; }
  .more { padding: 4px 4px; font-size: 12px; color: var(--muted); }
  .more.st { margin-left: auto; color: var(--faint); }
  .more:hover { color: var(--strong); }

  /* 抽屉 */
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--side); border-left: 1px solid var(--line); z-index: 10;
    transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; box-shadow: -12px 0 28px rgba(0,0,0,.3); }
  #drawer.open { transform: none; }
  .dh { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 16px 16px 14px 20px; border-bottom: 1px solid var(--line); }
  .dh h3 { margin: 0; font: 600 14px/1.4 var(--mono); color: var(--strong); word-break: break-all; }
  .dh .sub { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .dh .av { grid-row: 1 / span 2; }
  .close { grid-column: 3; grid-row: 1; width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; color: var(--muted); }
  .close:hover { background: var(--hover); color: var(--strong); }
  .db { overflow: auto; padding: 6px 0 24px; }
  .kv { display: grid; grid-template-columns: 76px 1fr; gap: 7px 12px; padding: 12px 20px; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--strong); min-width: 0; word-break: break-all; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .kv a { text-decoration: none; } .kv a:hover { text-decoration: underline; }
  .links { display: flex; gap: 8px; padding: 2px 20px 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 3px; border: 1px solid var(--input-line); background: var(--input); font-size: 12px; text-decoration: none; color: var(--fg); }
  .btn:hover { color: var(--strong); border-color: var(--muted); }
  .ds { padding: 16px 20px 6px; font-size: 11px; color: var(--muted); letter-spacing: .05em; display: flex; gap: 8px; align-items: center; }
  .commit { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; padding: 7px 20px; }
  .commit .av { margin-top: 2px; }
  .commit .s { color: var(--strong); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .commit .m { grid-column: 2; font-size: 11px; color: var(--muted); }
  .commit .m a { font-family: var(--mono); }

  /* 未提交的文件 */
  .wt { margin: 6px 12px 12px; border: 1px solid var(--card-line); border-radius: 6px; overflow: hidden; }
  .wth { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 10px; background: var(--card); }
  .wth b { color: var(--strong); font-weight: 600; }
  .wth .p { grid-column: 1 / -1; font-size: 11px; color: var(--faint); word-break: break-all; font-family: var(--mono); }
  .wth .b { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .file { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; padding: 3px 10px; font-size: 12.5px; align-items: baseline; }
  .file:hover { background: var(--hover); }
  .file .c { font-family: var(--mono); font-weight: 700; font-size: 11.5px; }
  .file .c.M { color: var(--mod); } .file .c.A { color: var(--add); } .file .c.U { color: var(--new); } .file .c.D { color: var(--del); } .file .c.R { color: var(--ren); }
  .file .fp { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .file .fp span { direction: ltr; unicode-bidi: plaintext; }
  .file .fp .d { color: var(--faint); }
  .file .fp .f { color: var(--strong); }
  .file .ln { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  .file .ln .a { color: var(--add); } .file .ln .r { color: var(--del); }
  .fold { width: calc(100% - 24px); margin: 4px 12px; padding: 6px 8px; color: var(--muted); font-size: 12px; border-radius: 4px; }
  .fold:hover { background: var(--hover); color: var(--strong); }

  #tip { position: fixed; z-index: 20; pointer-events: none; max-width: 360px; background: var(--tip); border: 1px solid var(--input-line); border-radius: 4px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.35); color: var(--strong); }
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<section id="drawer" aria-label="详情"></section>
<div id="tip" hidden></div>
<script src="data.js"></script>
<script>
'use strict';
const D = window.BRANCH_MAP_DATA;
if (!D) {
  document.body.innerHTML = '<p style="padding:40px;color:var(--muted)">没有数据 · 先运行 <code>npm run collect</code></p>';
  throw new Error('data.js 不存在');
}
const NOW = D.generatedAt;
const DAY = 86400;
const STALE_DAYS = 14;      // 超过这么久没有新提交的「进行中」算停滞
const RELEASED_DAYS = 14;   // 「已上线」只列最近这么多天的
const CAP = 6;              // 每列先显示几张
const PALETTE = ['#4daafc', '#f0883e', '#a371f7', '#3fb950', '#db61a2', '#e3b341', '#39c5cf', '#ff7b72', '#7ee787', '#d2a8ff', '#79c0ff', '#ffa657'];
const TEMP = /\\(AppData\\Local\\)?Temp\\|^[A-Z]:\\Temp\\/i;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 人 ---------- */
const people = D.people.map((p, id) => ({ ...p, id }));
[...people].sort((a, b) => b.commits - a.commits).forEach((p, i) => (p.color = PALETTE[i % PALETTE.length]));
function avatar(id, size) {
  const p = people[id];
  const initial = esc([...(p?.name ?? '?').trim()][0]?.toUpperCase() ?? '?');
  const img = p?.avatar ? `<img src="${esc(p.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="av s${size}" style="background:${p?.color ?? 'var(--select)'}" data-name="${esc(p?.name ?? '')}">${initial}${img}</span>`;
}
const pname = (id) => esc(people[id]?.name ?? '?');

/* ---------- 仓库 ---------- */
const repos = D.repos.map((r, ri) => {
  const byName = new Map();
  const branches = r.branches.map((b) => {
    const B = { name: b.n, head: b.r >= 0 ? b.r : b.l, local: b.l, remote: b.r, track: b.k };
    byName.set(B.name, B);
    return B;
  }).filter((B) => B.head >= 0);
  const prsByHead = new Map();
  for (const p of [...r.prs].sort((a, b) => a.updated - b.updated)) prsByHead.set(p.head, p);
  const worktrees = r.worktrees.map((w) => ({ ...w, temp: TEMP.test(w.path), label: w.main ? '主目录' : w.path.split('\\').pop() }));
  return { ...r, ri, branches, byName, prsByHead, worktrees, cache: new Map(), c: r.commits };
});

/* ---------- 分支之间的关系（只在内存里走提交图，不执行任何 git 命令） ----------
   以 base 的第一父链为主干，算出每条分支相对它的独有提交、分出点、合回点。 */
function analyze(R, baseName) {
  if (R.cache.has(baseName)) return R.cache.get(baseName);
  const { p: P, t: T } = R.c;
  const N = P.length;
  const X = R.byName.get(baseName).head;

  const inX = new Uint8Array(N);
  let sizeX = 1;
  inX[X] = 1;
  for (const st = [X]; st.length; ) for (const q of P[st.pop()]) if (!inX[q]) { inX[q] = 1; sizeX++; st.push(q); }

  const trunk = [];
  for (let c = X; c !== undefined; c = P[c][0]) trunk.push(c);
  const onTrunk = new Uint8Array(N);
  trunk.forEach((c) => (onTrunk[c] = 1));

  // intro[c]：提交 c 是主干上第几个提交（0 = 最新）带进来的
  const intro = new Int32Array(N).fill(-1);
  for (let i = trunk.length - 1; i >= 0; i--) {
    const t0 = trunk[i];
    intro[t0] = i;
    for (const st = P[t0].slice(1); st.length; ) {
      const c = st.pop();
      if (intro[c] >= 0) continue;
      intro[c] = i;
      for (const q of P[c]) if (intro[q] < 0) st.push(q);
    }
  }

  const seen = new Int32Array(N);
  let gen = 0;
  const rows = [];
  for (const B of R.branches) {
    if (B.name === baseName) continue;
    const H = B.head;
    gen++;
    let common = 0;
    const ahead = [];
    seen[H] = gen;
    for (const st = [H]; st.length; ) {
      const c = st.pop();
      if (inX[c]) common++; else ahead.push(c);
      for (const q of P[c]) if (seen[q] !== gen) { seen[q] = gen; st.push(q); }
    }
    // 分支头比 PR 结束得还晚，说明那个 PR 是旧的一轮（长期分支常见），不算数
    const last = R.prsByHead.get(B.name);
    const pr = last && (last.state === 'OPEN' || last.state === 'DRAFT' || (last.merged ?? last.updated) >= T[H] - 60) ? last : null;
    let own = ahead, mergeTime = null, status;
    if (ahead.length) {
      if (pr && pr.state === 'MERGED' && pr.base === baseName) { status = 'merged'; mergeTime = pr.merged; }
      else status = NOW - T[H] <= STALE_DAYS * DAY ? 'active' : 'stale';
    } else if (onTrunk[H]) {
      status = 'none';
      own = [];
    } else {
      // 已经通过一次合并进了主干：独有提交 = 那次合并带进来、且从分支头能走到的提交
      const m = intro[H];
      own = [];
      gen++;
      for (const st = [H]; st.length; ) {
        const c = st.pop();
        if (seen[c] === gen || intro[c] !== m) continue;
        seen[c] = gen;
        own.push(c);
        for (const q of P[c]) st.push(q);
      }
      status = 'merged';
      mergeTime = T[trunk[m]];
    }
    rows.push({ R, B, status, pr, owner: ownerOf(R, own, H), ahead: ahead.length, behind: sizeX - common, own: own.sort((x, y) => T[y] - T[x]), headTime: T[H], mergeTime });
  }
  const result = { base: baseName, trunk, rows };
  R.cache.set(baseName, result);
  return result;
}
function ownerOf(R, list, H) {
  const tally = new Map();
  for (const c of list) tally.set(R.c.a[c], (tally.get(R.c.a[c]) ?? 0) + 1);
  return tally.size ? [...tally].sort((x, y) => y[1] - x[1])[0][0] : R.c.a[H];
}

/* 一条分支「自己的工作」以 dev 为准（dev 是大家往里合的那条线）；
   进了 dev 没进 main 的是「待上线」，进了 main 的是「已上线」。 */
function board(R) {
  if (R.cache.has('board')) return R.cache.get('board');
  const out = { active: [], stale: [], pending: [], released: [], pendingCommits: 0, thirdLabel: '已上线' };
  const skip = (name) => name === R.prod || name === R.dev;
  if (R.dev && R.prod) {
    const byDev = new Map(analyze(R, R.dev).rows.map((r) => [r.B.name, r]));
    for (const r of analyze(R, R.prod).rows) {
      if (r.B.name === R.dev) { out.pendingCommits = r.ahead; continue; }
      if (skip(r.B.name)) continue;
      const d = byDev.get(r.B.name);
      if (r.ahead > 0) {
        if (d.status === 'active' || d.status === 'stale') out[d.status].push(d);
        else out.pending.push({ ...d, status: 'pending' });
      } else if (r.status === 'merged') {
        out.released.push(d.own.length ? { ...r, own: d.own, owner: d.owner, devTime: d.mergeTime } : r);
      }
    }
  } else {
    const base = R.dev ?? R.prod ?? R.branches[0]?.name;
    if (!R.prod) out.thirdLabel = '已合并';
    if (base) for (const r of analyze(R, base).rows) {
      if (skip(r.B.name)) continue;
      if (r.status === 'active' || r.status === 'stale') out[r.status].push(r);
      else if (r.status === 'merged') out.released.push(r);
    }
  }
  out.released = out.released.filter((r) => r.mergeTime >= NOW - RELEASED_DAYS * DAY);
  out.active.sort((a, b) => b.headTime - a.headTime);
  out.stale.sort((a, b) => b.headTime - a.headTime);
  out.pending.sort((a, b) => (b.mergeTime ?? b.headTime) - (a.mergeTime ?? a.headTime));
  out.released.sort((a, b) => b.mergeTime - a.mergeTime);
  R.cache.set('board', out);
  return out;
}
const localWorktrees = (R) => R.worktrees.filter((w) => !w.temp);
const dirtyCount = (R) => localWorktrees(R).reduce((s, w) => s + w.total, 0);

/* ---------- 状态 ---------- */
const state = { person: null, q: '', expand: new Set(), drawer: null, showTemp: false };

/* ---------- 工具 ---------- */
function ago(t) {
  const s = NOW - t;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' 分钟前';
  if (s < DAY) return Math.round(s / 3600) + ' 小时前';
  if (s < 45 * DAY) return Math.round(s / DAY) + ' 天前';
  return day(t);
}
function day(t) { const d = new Date(t * 1000); return `${d.getMonth() + 1}月${d.getDate()}日`; }
function stamp(t) { const d = new Date(t * 1000); return `${day(t)} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
const icon = {
  branch: '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 9.5a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm7-7a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM4.25 1a2.25 2.25 0 0 0-.75 4.37v5.26a2.25 2.25 0 1 0 1.5 0V9.5c.37.2.8.3 1.25.3h2.5a2.25 2.25 0 0 0 2.2-1.78 2.25 2.25 0 1 0-1.53-.2A.75.75 0 0 1 8.75 8.3h-2.5A1.25 1.25 0 0 1 5 7.05V5.37A2.25 2.25 0 0 0 4.25 1Z"/></svg>',
  close: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="m8 7.1 3.6-3.6.9.9L8.9 8l3.6 3.6-.9.9L8 8.9l-3.6 3.6-.9-.9L7.1 8 3.5 4.4l.9-.9z"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.2 10.1 14.6 13.5l-1.1 1.1-3.4-3.4a5.5 5.5 0 1 1 1.1-1.1ZM6.7 11a4.3 4.3 0 1 0 0-8.6 4.3 4.3 0 0 0 0 8.6Z"/></svg>',
  ext: '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M9 2h5v5h-1.5V4.6L7.3 9.7 6.3 8.7l5.1-5.2H9zM3 4h4v1.5H4.5v6h6V9H12v4H3z"/></svg>',
};

/* ---------- 侧栏：项目 + 成员 ---------- */
function renderSide() {
  const repoItems = repos.map((R) => {
    const n = dirtyCount(R);
    return `<button class="item" data-jump="${R.ri}">
      <span class="t"><span class="n1">${esc(R.name)}</span><span class="n2">${icon.branch}${esc(R.current || '—')}</span></span>
      ${n ? `<span class="dirty" title="未提交">${n}</span>` : ''}
    </button>`;
  }).join('');

  // 成员：按进行中的分支数排，没有任何卡片的人不列
  const tally = new Map();
  for (const R of repos) {
    const b = board(R);
    for (const r of [...b.active, ...b.stale, ...b.pending, ...b.released]) {
      const e = tally.get(r.owner) ?? { active: 0, last: 0 };
      if (r.status === 'active') e.active++;
      e.last = Math.max(e.last, r.headTime);
      tally.set(r.owner, e);
    }
  }
  const peopleItems = [...tally].sort((a, b) => b[1].active - a[1].active || b[1].last - a[1].last).map(([id, e]) => `
    <button class="item" data-person="${id}" aria-pressed="${state.person === id}">
      ${avatar(id, 22)}<span class="t"><span class="n1">${pname(id)}</span><span class="n2">${ago(e.last)}</span></span>
      ${e.active ? `<span class="cnt" title="进行中">${e.active}</span>` : ''}
    </button>`).join('');

  $('#side').innerHTML = `
    <div class="brand"><b>分支地图</b><span title="数据采集时间">${stamp(NOW)}</span></div>
    <div class="sh">项目</div>${repoItems}
    <div class="sh">成员</div>${peopleItems}`;
}

/* ---------- 主区 ---------- */
function match(r) {
  if (state.person != null && r.owner !== state.person) return false;
  if (state.q && !r.B.name.toLowerCase().includes(state.q)) return false;
  return true;
}
function checkedOutIn(R, name) { return R.worktrees.filter((w) => w.branch === name && !w.temp); }

function card(r) {
  const { R, B } = r;
  const id = `${R.ri}:${B.name}`;
  const wts = checkedOutIn(R, B.name);
  const dirty = wts.reduce((s, w) => s + w.total, 0);
  const bits = [];
  if (r.status === 'active' || r.status === 'stale') bits.push(`<span class="up" title="比 dev 多几个提交">↑${r.ahead}</span>`);
  if (r.pr) bits.push(`<span class="pr ${r.pr.state}" title="${esc(r.pr.title)}">#${r.pr.n}</span>`);
  const when = r.status === 'pending' || r.status === 'merged' ? ago(r.mergeTime ?? r.headTime) : ago(r.headTime);
  const tags = [];
  if (wts.length) tags.push('<span class="tag here">已检出</span>');
  if (dirty) tags.push(`<span class="dirty">${dirty}</span>`);
  if (B.remote < 0) tags.push('<span class="tag">仅本地</span>');
  return `<button class="card${r.status === 'stale' ? ' dim' : ''}${state.drawer?.id === id ? ' sel' : ''}" data-open="${esc(id)}">
    ${avatar(r.owner, 26)}
    <span class="bn" title="${esc(B.name)}">${esc(B.name)}</span>
    <span class="rt">${bits.join('')}</span>
    <span class="meta">${pname(r.owner)} · ${when}${tags.join('')}</span>
  </button>`;
}

function column(R, key, label, list, extra = '', staleList = null) {
  const shown = list.filter(match);
  const k = `${R.ri}:${key}`;
  const open = state.expand.has(k);
  const cards = (open ? shown : shown.slice(0, CAP)).map(card).join('');
  let tail = '';
  if (shown.length > CAP && !open) tail += `<button class="more" data-expand="${k}">+${shown.length - CAP}</button>`;
  let staleBlock = '';
  if (staleList) {
    const st = staleList.filter(match);
    const ks = `${R.ri}:stale`;
    if (st.length) {
      if (state.expand.has(ks)) staleBlock = `<div class="chead" style="padding-top:12px">停滞<span class="n">${st.length}</span></div><div class="stack">${st.map(card).join('')}</div>`;
      else tail += `<button class="more st" data-expand="${ks}">停滞 ${st.length}</button>`;
    }
  }
  return `<div class="col">
    <div class="chead"><b>${label}</b><span class="n">${shown.length}</span>${extra}</div>
    <div class="stack">${cards || '<div class="empty">—</div>'}</div>${tail ? `<div class="tail">${tail}</div>` : ''}${staleBlock}
  </div>`;
}

function renderMain() {
  const who = state.person != null
    ? `<span class="who">${avatar(state.person, 22)}${pname(state.person)}<button data-person="${state.person}" aria-label="取消">${icon.close}</button></span>` : '';
  const sections = repos.map((R) => {
    const b = board(R);
    const n = dirtyCount(R);
    const main = R.worktrees.find((w) => w.main);
    const chips = [R.byName.has(R.current) ? `<button class="chip" data-open="${R.ri}:${esc(R.current)}" title="本地检出">${icon.branch}<span class="mono">${esc(R.current)}</span></button>` : `<span class="chip">${icon.branch}<span class="mono">${esc(R.current || '（游离）')}</span></span>`];
    chips.push(n ? `<button class="chip warn" data-files="${R.ri}">未提交 ${n}</button>` : '<span class="chip quiet">无改动</span>');
    if (main?.ahead) chips.push(`<span class="chip">未推送 ${main.ahead}</span>`);
    if (main?.behind) chips.push(`<span class="chip">未拉取 ${main.behind}</span>`);
    const all = [R.prod, R.dev, ...R.branches.map((B) => B.name).filter((x) => x !== R.prod && x !== R.dev).sort((x, y) => R.c.t[R.byName.get(y).head] - R.c.t[R.byName.get(x).head])].filter(Boolean);
    const pick = `<select class="pick" data-pick="${R.ri}" aria-label="查看分支"><option value="">查看分支（${R.branches.length}）</option>${all.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select>`;
    const pendingExtra = b.pendingCommits ? `<span class="x">${b.pendingCommits} 个提交</span>` : '';
    return `<section class="repo" id="repo-${R.ri}">
      <div class="rhead"><h2>${esc(R.name)}</h2>${chips.join('')}${pick}</div>
      <div class="cols">
        ${column(R, 'active', '进行中', b.active, '', b.stale)}
        ${column(R, 'pending', '待上线', R.dev && R.prod ? b.pending : [], pendingExtra)}
        ${column(R, 'released', b.thirdLabel, b.released, `<span class="x">近 ${RELEASED_DAYS} 天</span>`)}
      </div>
    </section>`;
  }).join('');
  const hadFocus = document.activeElement?.id === 'q';
  $('#main').innerHTML = `
    <div class="top">
      <label class="search">${icon.search}<input id="q" placeholder="搜分支" value="${esc(state.q)}" autocomplete="off"></label>
      ${who}<span class="spacer"></span>
    </div>${sections}`;
  if (hadFocus) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ---------- 抽屉：分支 / 未提交的文件 ---------- */
function drawerBranch(R, name) {
  const B = R.byName.get(name);
  if (!B) return '';
  const b = board(R);
  const r = [...b.active, ...b.stale, ...b.pending, ...b.released].find((x) => x.B.name === name);
  const trunkish = !r;
  const gh = R.slug ? `https://github.com/${R.slug}` : null;
  const status = r ? { active: '进行中', stale: '停滞', pending: '待上线', merged: b.thirdLabel }[r.status] : name === R.prod ? '生产' : name === R.dev ? '开发' : '无新提交';
  const owner = r ? r.owner : R.c.a[B.head];

  const kv = [];
  kv.push(['最后提交', `${stamp(R.c.t[B.head])} · ${pname(R.c.a[B.head])}`]);
  if (r && (r.status === 'active' || r.status === 'stale')) kv.push(['相对 dev', `<span class="up">↑${r.ahead} ↓${r.behind}</span>`]);
  if (r?.status === 'pending' && r.mergeTime) kv.push(['合入 dev', stamp(r.mergeTime)]);
  if (r?.status === 'merged' && r.mergeTime) { if (r.devTime) kv.push(['合入 dev', stamp(r.devTime)]); kv.push([b.thirdLabel === '已上线' ? '上线' : '合入', stamp(r.mergeTime)]); }
  if (name === R.dev && b.pendingCommits) kv.push(['待上线', `${b.pendingCommits} 个提交`]);
  if (r?.pr) kv.push(['PR', `<a href="${esc(r.pr.url)}" target="_blank" rel="noreferrer"><span class="pr ${r.pr.state}">#${r.pr.n}</span> ${esc(r.pr.title)}</a>`]);
  for (const w of R.worktrees.filter((w) => w.branch === name)) {
    kv.push(['已检出', `<span class="mono" style="font-size:11.5px">${esc(w.path)}</span>${w.total ? `<button class="chip warn" data-files="${R.ri}">未提交 ${w.total}</button>` : ''}`]);
  }
  if (B.remote < 0) kv.push(['远程', '仅本地']);

  const links = [];
  if (gh && B.remote >= 0) {
    links.push(`<a class="btn" href="${gh}/tree/${encodeURI(name)}" target="_blank" rel="noreferrer">GitHub ${icon.ext}</a>`);
    if (r && (r.status === 'active' || r.status === 'stale') && R.dev) links.push(`<a class="btn" href="${gh}/compare/${encodeURI(R.dev)}...${encodeURI(name)}" target="_blank" rel="noreferrer">对比 dev ${icon.ext}</a>`);
  }

  // 提交：普通分支列它自己的提交；main / dev 这类主线列最近进来的
  let commits, title;
  if (trunkish) {
    commits = analyze(R, name).trunk.slice(0, 60);
    title = '最近提交';
  } else {
    commits = r.own.slice(0, 200);
    title = `提交 ${r.own.length}`;
  }
  const list = commits.map((c) => `
    <div class="commit">${avatar(R.c.a[c], 16)}<div class="s">${esc(R.c.s[c])}</div>
    <div class="m">${pname(R.c.a[c])} · ${ago(R.c.t[c])} · ${gh ? `<a href="${gh}/commit/${R.c.h[c]}" target="_blank" rel="noreferrer">${R.c.h[c].slice(0, 7)}</a>` : R.c.h[c].slice(0, 7)}</div></div>`).join('');

  return `<div class="dh">${avatar(owner, 36)}<h3>${esc(name)}</h3><button class="close" data-close aria-label="关闭">${icon.close}</button>
      <div class="sub">${esc(R.name)} · ${status} · ${pname(owner)}</div></div>
    <div class="db">
      <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      ${links.length ? `<div class="links">${links.join('')}</div>` : ''}
      ${commits.length ? `<div class="ds">${title}</div>${list}` : ''}
    </div>`;
}

function fileRow(f) {
  const i = f.p.lastIndexOf('/');
  const dir = i >= 0 ? f.p.slice(0, i + 1) : '';
  const base = i >= 0 ? f.p.slice(i + 1) : f.p;
  const ln = f.a != null || f.d != null ? `<span class="ln">${f.a ? `<span class="a">+${f.a}</span> ` : ''}${f.d ? `<span class="r">−${f.d}</span>` : ''}</span>` : '<span></span>';
  const name = { M: '已修改', A: '已添加', U: '未跟踪', D: '已删除', R: '已重命名' }[f.c] ?? f.c;
  return `<div class="file" title="${esc(f.p)}"><span class="c ${esc(f.c)}" title="${name}${f.s ? '（已暂存）' : ''}">${esc(f.c)}</span><span class="fp"><span><span class="d">${esc(dir)}</span><span class="f">${esc(base)}</span></span></span>${ln}</div>`;
}
function drawerFiles(R) {
  const block = (w) => `<div class="wt">
      <div class="wth"><b>${esc(w.label)}</b><span class="b">${icon.branch}<span class="mono">${esc(w.branch ?? '（游离）')}</span>${w.ahead ? `<span class="tag">未推送 ${w.ahead}</span>` : ''}</span><span class="p">${esc(w.path)}</span></div>
      ${w.files.map(fileRow).join('')}${w.total > w.files.length ? `<div class="file"><span></span><span class="d">还有 ${w.total - w.files.length} 个</span></div>` : ''}
    </div>`;
  const local = localWorktrees(R).filter((w) => w.total);
  const temp = R.worktrees.filter((w) => w.temp && w.total);
  return `<div class="dh"><span></span><h3>未提交 · ${esc(R.name)}</h3><button class="close" data-close aria-label="关闭">${icon.close}</button>
      <div class="sub">${local.reduce((s, w) => s + w.total, 0)} 个文件 · ${local.length} 个工作树</div></div>
    <div class="db">
      ${local.map(block).join('') || '<div class="ds">无改动</div>'}
      ${temp.length ? (state.showTemp ? `<div class="ds">临时目录</div>${temp.map(block).join('')}` : `<button class="fold" data-temp>临时目录 ${temp.length}</button>`) : ''}
    </div>`;
}

function renderDrawer() {
  const el = $('#drawer');
  const d = state.drawer;
  if (!d) { el.classList.remove('open'); return; }
  const R = repos[d.ri];
  el.innerHTML = d.kind === 'files' ? drawerFiles(R) : drawerBranch(R, d.name);
  el.classList.add('open');
}

function render() {
  const scroll = $('#main').scrollTop;
  renderSide();
  renderMain();
  renderDrawer();
  $('#main').scrollTop = scroll;
}

/* ---------- 交互 ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-jump],[data-person],[data-open],[data-files],[data-expand],[data-close],[data-temp]');
  if (!t || e.target.closest('a')) return;
  const ds = t.dataset;
  if (ds.jump !== undefined) { $(`#repo-${ds.jump}`).scrollIntoView({ block: 'start' }); return; }
  if (ds.person !== undefined) { const id = Number(ds.person); state.person = state.person === id ? null : id; }
  else if (ds.open) { const i = ds.open.indexOf(':'); const id = ds.open; state.drawer = state.drawer?.id === id ? null : { kind: 'branch', id, ri: Number(id.slice(0, i)), name: id.slice(i + 1) }; }
  else if (ds.files !== undefined) state.drawer = { kind: 'files', id: 'files:' + ds.files, ri: Number(ds.files) };
  else if (ds.expand) state.expand.add(ds.expand);
  else if (ds.close !== undefined) state.drawer = null;
  else if (ds.temp !== undefined) state.showTemp = true;
  render();
});
document.addEventListener('change', (e) => {
  const ri = e.target.dataset?.pick;
  if (ri === undefined || !e.target.value) return;
  state.drawer = { kind: 'branch', id: `${ri}:${e.target.value}`, ri: Number(ri), name: e.target.value };
  render();
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.q = e.target.value.trim().toLowerCase();
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.drawer) { state.drawer = null; render(); }
});
// 头像悬停显示名字
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const a = e.target.closest?.('[data-name]');
  if (!a) { tip.hidden = true; return; }
  tip.textContent = a.dataset.name;
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = e.clientY + 16 + 'px';
});

render();
</script>
</body>
